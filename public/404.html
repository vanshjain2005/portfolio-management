<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Studio</title>
    <script>
      (function () {
        var base = '/portfolio-management/';
        var isGithubPages = window.location.hostname.includes('github.io');
        var root = isGithubPages ? base : '/';
        sessionStorage.setItem('redirect', window.location.pathname.replace(base, '/') + window.location.search);
        window.location.replace(root);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
